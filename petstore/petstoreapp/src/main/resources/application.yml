bing:
  search:
    subscription:
      key: ${BING_SEARCH_SUBSCRIPTION_KEY:}
petstore:
  service:
    pet:
     url: ${PETSTOREPETSERVICE_URL:http://localhost:8081}
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    order:
      url: ${PETSTOREORDERSERVICE_URL:http://localhost:8083}
  logging:
    additional-headers-to-log: ${PETSTORE_ADDITIONAL_HEADERS_TO_LOG:}
    additional-headers-to-send: ${PETSTORE_ADDITIONAL_HEADERS_TO_SEND:}
  signalR:
    negotiation-url: ${SIGNALR_NEGOTIATION_URL:}
    service-url: ${SIGNALR_SERVICE_URL:}
    key: ${SIGNALR_SERVICE_KEY:}
    update:
      fixedRate: ${SIGNALR_UPDATE_FIXEDRATE:60000}
server:
  port: ${PETSTOREAPP_SERVER_PORT:8080}
  forward-headers-strategy: native
  use-forward-headers: true

logging:
  level:
    root: info
    com.azure.spring.cloud: debug
    org.springframework.security: debug
    org:
      springframework:
        web:
          client:
            RestTemplate: DEBUG
        security:
          oauth2:
            client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"       
  trace:
    http:
      enabled: true 
  endpoint:
    httptrace:
      enabled: true

spring:
  application:
    name: petstoreapp
  thymeleaf:
    cache: false
  cache:
    cache-names: currentUsers
  cloud:
    azure:
      active-directory:
        b2c:
          profile:
            tenant-id: ${TENANT_ID:module10epamtenant}
          base-uri: ${BASE_URI:https://module10epamtenant.b2clogin.com/}
          credential:
            client-id: ${CLIENT_ID:e5b49661-1e3e-4205-8268-2c4c79e23039}
            client-secret: ${CLIENT_SECRET:avy8Q~~r~qQZr7Y012NyDF2p3eOYWc-on5DtXa77}
          logout-success-url: ${LOGOUT_SUCCESS_URL:http://localhost:8080}
          scope: openid
          login-flow: sign-up-or-sign-in
          reply-url: ${HOME_URL:http://localhost:8080}
          user-flows:
            sign-up-or-sign-in: ${USER_FLOW:B2C_1_signup_and_signin_v2}