      key: ${AZURE_COSMOS_KEY:CyuSfoLTQGCrjHUK66BD7TC998uRC7A2aOA6RMWXbB9CSD7AIPLCTsm1KoPQFsYyHCMgQ8ENLzG4ACDbmmrVlQ==}
      database: ${AZURE_COSMOS_DATABASE:OrderDatabase}
      container: ${AZURE_COSMOS_CONTAINER:OrderContainer}
